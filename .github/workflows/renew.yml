name: Katabump Auto Renew
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Restore renew-state cache
        uses: actions/cache/restore@v4
        with:
          path: renew_state.json
          key: renew-state-${{ github.run_id }}
          restore-keys: |
            renew-state-

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: Start Proxy (sing-box)
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_CHAIN_URL: ${{ secrets.PROXY_CHAIN_URL }}
        run: |
          if [ -z "$PROXY_URL" ]; then
            echo "PROXY_URL not set, skipping sing-box setup."
            exit 0
          fi
          # ……这一步原样保留，不改……

      - name: Run Renew Script
        id: renew
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_CHAIN_URL: ${{ secrets.PROXY_CHAIN_URL }}
          # ⚠️ 修复之前的 bug：没配 PROXY_URL 就不要挂代理
          PROXY_SERVER: ${{ secrets.PROXY_URL != '' && 'http://127.0.0.1:8080' || '' }}
          IS_PROXY: ${{ secrets.PROXY_URL != '' && 'true' || 'false' }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py
        # 注意：这里故意不接退出码，让后续 Bark 步骤永远能跑

      - name: Bark notify
        if: always()
        env:
          BARK_URL: ${{ secrets.BARK_URL }}
        run: |
          set -e
          TITLE="KataBump续期"
          # 判断 Run Renew Script 这一步是否成功
          if [ "${{ steps.renew.outcome }}" = "success" ]; then
            BODY="✅ 续期流程完成"
          else
            BODY="❌ 续期失败，请查看 Actions 日志与截图"
          fi
          ENCODED=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$BODY")
          curl -sS -m 15 "$BARK_URL/$TITLE/$ENCODED?group=KataBump&sound=bell"
